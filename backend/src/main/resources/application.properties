# Application
spring.application.name=smartbet-api
server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/smartbet_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# CORS (allow React Native dev server)
app.cors.allowed-origins=http://localhost:8081,http://localhost:3000,http://localhost:5173,http://localhost:5174,exp://localhost:8081

# Data provider: "sportmonks" or "footballdata"
football.provider=${FOOTBALL_PROVIDER:footballdata}
football-data.base-url=https://api.football-data.org/v4
football-data.api-token=${FOOTBALL_DATA_TOKEN:4cfba8ef44df4bd8a87da8ec96038c1a}

# Bookmaker odds (the-odds-api.com, free tier 500 req/month)
odds-api.base-url=https://api.the-odds-api.com/v4
odds-api.api-key=${ODDS_API_KEY:}
odds-api.regions=eu

# Sportmonks Football API
sportmonks.base-url=https://api.sportmonks.com/v3/football
sportmonks.api-token=${SPORTMONKS_API_TOKEN:your_token_here}
sportmonks.sync.enabled=true
sportmonks.sync.morning-cron=0 0 6 * * ?
sportmonks.sync.evening-cron=0 0 20 * * ?
sportmonks.sync.results-cron=0 15 * * * ?

# Admin auth (change via env in production)
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:admin123}
app.auth.secret=${AUTH_SECRET:dev-secret-change-me}
app.auth.token-ttl-hours=24

# AI analysis (LLM) - set AI_API_KEY to enable generated analysis text
ai.enabled=${AI_ENABLED:false}
ai.api-key=${AI_API_KEY:}
ai.model=${AI_MODEL:claude-sonnet-4-20250514}
